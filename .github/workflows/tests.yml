# Tests on every pull request and on main. The job name "pytest" is the required status check of the main branch.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_BRANCH: ${{ github.head_ref || github.ref_name }}
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - name: Sibling repositories (same-named branch if it exists, else main)
        run: bash core/ci/checkout_siblings.sh crv umbrella
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/ci/requirements.txt
      - name: Python packages
        run: python -m pip install -q -r core/ci/requirements.txt
      - name: Public Offline files
        run: |
          bash core/ci/offline_data.sh "$RUNNER_TEMP/offline_data"
          echo "MU2E_SEARCH_PATH=$RUNNER_TEMP/offline_data" >> "$GITHUB_ENV"
      - name: pytest
        working-directory: core
        env:
          PYTHONPATH: ${{ github.workspace }}/core:${{ github.workspace }}/crv:${{ github.workspace }}/umbrella/beam
        run: python -m pytest -q -p no:cacheprovider --durations=15 tests
