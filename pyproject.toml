[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2efastsim"
version = "0.1.0"
description = "Detector-independent core of the Mu2e Geant4-free fast simulation (energy loss, materials, world, crossings, tables)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# hep-endpoints (import name hependpoints): the experiment-neutral endpoint adapters, pinned to a commit of
# RobMina/hep-endpoints (not on PyPI); for development install a local checkout with pip install -e first.
dependencies = ["numpy", "pandas", "uproot", "matplotlib", "scipy", "hep-endpoints @ git+https://github.com/RobMina/hep-endpoints.git@5327d2d9247f4a1879461cec6a6d4046d5b88134"]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mu2efastsim*"]
